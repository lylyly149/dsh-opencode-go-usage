name: Release

# Manual until npm Trusted Publishing is configured for this repository.
# After configuring it on npmjs.com, this workflow can publish a release
# without a long-lived token; switch the trigger to tags if desired.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Publish with provenance
        run: npm publish --provenance --access public
