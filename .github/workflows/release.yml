name: Release

# Run manually on the matching v<package-version> tag. npm authenticates this
# workflow through its configured Trusted Publisher, without a stored token.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify release tag matches package version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
          if (process.env.GITHUB_REF_TYPE !== 'tag' || process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Run Release on the immutable tag v${version}`)
          }
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Check published file list
        run: npm pack --dry-run
      - name: Publish with provenance
        run: npm publish --provenance --access public
